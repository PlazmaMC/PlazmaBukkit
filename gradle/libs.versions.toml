[versions]
kotlin = "2.4.21"

mache = "26.3+build.2"
paperclip = "3.0.4"
paperweight = "2.0.0-beta.24"

annotations-jetbrains = "26.1.0"
annotations-jspecify = "1.0.0"

adventure = "5.2.0"
leafpile = "1.3.3"
mavenResolver-provider = "3.9.6"
mavenResolver = "1.9.18"
commons-lang2 = "2.6"
commons-lang3 = "3.20.0"
asm = "9.9.1"

serialization-snakeyaml = "2.2"
serialization-joml = "1.10.9"
serialization-gson = "2.14.0"

fastutil = "8.5.18"
brigadier = "1.3.11"
jline = "4.4.6"
tca = "1.3.0"
velocity = "4.1.0"
configurate = "4.2.0"
netty = "4.2.16.Final"
bungeecord-chat = "1.21-R0.2-deprecated+build.21"
log4j = "2.26.0"
slf4j = "2.0.17"
guava = "33.6.0-jre"
upnp4j = "1.0"
rhino = "1.7.14"
jdbc-sqlite = "3.49.1.0"
jdbc-mysql = "9.2.0"
disruptor = "3.4.4"
jsonSimple = "1.1.1"

junit = "6.0.3"
junitPioneer = "2.3.0"
mockito = "5.22.0"
hamcrest = "2.2"
checkerQual = "4.2.3"
classgraph = "4.8.184"

spark = "1.10.191"
spark-api = "0.1-20240720.200737-2"


[plugins]
paperweight-patcher = { id = "io.papermc.paperweight.patcher", version.ref = "paperweight" }


[bundles]
adventure = ["adventure-api", "adventure-key", "adventure-text-minimessage", "adventure-text-serializer-gson", "adventure-text-serializer-legacy", "adventure-text-serializer-plain", "adventure-text-logger-slf4j"]
leafpile = ["leafpile-common", "leafpile-concurrentUtil", "leafpile-converter", "leafpile-ioUtil"]
test = ["test-junit-jupiter", "test-hamcrest", "test-mockito", "asm-tree"]


[libraries]
mache = { module = "io.papermc:mache", version.ref = "mache" }
paperclip = { module = "io.papermc:paperclip", version.ref = "paperclip" }

annotations-jetbrains = { module = "org.jetbrains:annotations", version.ref = "annotations-jetbrains" }
annotations-jspecify = { module = "org.jspecify:jspecify", version.ref = "annotations-jspecify" }

adventure = { group = "net.kyori", name = "adventure-bom", version.ref = "adventure" }
adventure-api = { group = "net.kyori", name = "adventure-api" }
adventure-key = { group = "net.kyori", name = "adventure-key" }
adventure-text-minimessage = { group = "net.kyori", name = "adventure-text-minimessage" }
adventure-text-serializer-gson = { group = "net.kyori", name = "adventure-text-serializer-gson" }
adventure-text-serializer-legacy = { group = "net.kyori", name = "adventure-text-serializer-legacy" }
adventure-text-serializer-plain = { group = "net.kyori", name = "adventure-text-serializer-plain" }
adventure-text-serializer-ansi = { group = "net.kyori", name = "adventure-text-serializer-ansi" }
adventure-text-logger-slf4j = { group = "net.kyori", name = "adventure-text-logger-slf4j" }

leafpile = { group = "ca.spottedleaf.leafpile", name = "bom", version.ref = "leafpile" }
leafpile-common = { group = "ca.spottedleaf.leafpile", name = "common" }
leafpile-concurrentUtil = { group = "ca.spottedleaf.leafpile", name = "concurrentutil" }
leafpile-converter = { group = "ca.spottedleaf.leafpile", name = "converter" }
leafpile-ioUtil = { group = "ca.spottedleaf.leafpile", name = "ioutil" }

log4j-api = { group = "org.apache.logging.log4j", name = "log4j-api", version.ref = "log4j" }
log4j-core = { group = "org.apache.logging.log4j", name = "log4j-core", version.ref = "log4j" }
log4j-iostreams = { group = "org.apache.logging.log4j", name = "log4j-iostreams", version.ref = "log4j" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

mavenResolver-provider = { module = "org.apache.maven:maven-resolver-provider", version.ref = "mavenResolver-provider" }
mavenResolver-connector-basic = { module = "org.apache.maven.resolver:maven-resolver-connector-basic", version.ref = "mavenResolver" }
mavenResolver-transport-http = { module = "org.apache.maven.resolver:maven-resolver-transport-http", version.ref = "mavenResolver" }

commons-lang2 = { module = "commons-lang:commons-lang", version.ref = "commons-lang2" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }

asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }

rhino-runtime = { group = "org.mozilla", name = "rhino-runtime", version.ref = "rhino" }
rhino-engine = { group = "org.mozilla", name = "rhino-engine", version.ref = "rhino" }

serialization-gson = { module = "com.google.code.gson:gson", version.ref = "serialization-gson" }
serialization-snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "serialization-snakeyaml" }
serialization-joml = { module = "org.joml:joml", version.ref = "serialization-joml" }
serialization-jsonSimple = { module = "com.googlecode.json-simple:json-simple", version.ref = "jsonSimple" }

guava = { module = "com.google.guava:guava", version.ref = "guava" }
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
brigadier = { module = "com.mojang:brigadier", version.ref = "brigadier" }
bungeecord-chat = { module = "net.md-5:bungeecord-chat", version.ref = "bungeecord-chat" }
checkerQual = { module = "org.checkerframework:checker-qual", version.ref = "checkerQual" }
jline = { module = "org.jline:jline-terminal-ffm", version.ref = "jline" }
tca = { module = "net.minecrell:terminalconsoleappender", version.ref = "tca" }
velocity = { module = "com.velocitypowered:velocity-native", version.ref = "velocity" }
upnp4j = { module = "dev.omega24:upnp4j", version.ref = "upnp4j" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }

netty-codec-haproxy = { module = "io.netty:netty-codec-haproxy", version.ref = "netty" }

spark = { module = "me.lucko:spark-paper", version.ref = "spark" }
spark-api = { module = "me.lucko:spark-api", version.ref = "spark-api" }

jdbc-sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "jdbc-sqlite" }
jdbc-mysql = { module = "com.mysql:mysql-connector-j", version.ref = "jdbc-mysql" }
disruptor = { module = "com.lmax:disruptor", version.ref = "disruptor" }

test-junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
test-junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
test-junit-platform-engine = { module = "org.junit.platform:junit-platform-suite-engine", version.ref = "junit" }
test-junitPioneer = { module = "org.junit-pioneer:junit-pioneer", version.ref = "junitPioneer" }

test-classgraph = { module = "io.github.classgraph:classgraph", version.ref = "classgraph" }
test-hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
test-mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
